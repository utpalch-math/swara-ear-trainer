  <script>
    let audioCtx = null;
    let loopBus = null;
    let sampleBuffer = null;
    const SAMPLE_BASE_FREQ = 116.54;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        loopBus = audioCtx.createGain();
        loopBus.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    /* --------------------------------------------------------------------------
       ENGINE 1: STUDIO SAMPLED (VERSION 3)
       Pre-renders an acoustic Tanpura impulse buffer with Jawari overtone bloom
       -------------------------------------------------------------------------- */
    function prepareAcousticSample() {
      if (sampleBuffer) return;
      const ctx = getAudioContext();
      const sampleRate = ctx.sampleRate;
      const duration = 4.0;
      const frameCount = sampleRate * duration;
      sampleBuffer = ctx.createBuffer(1, frameCount, sampleRate);
      const data = sampleBuffer.getChannelData(0);

      const f0 = SAMPLE_BASE_FREQ;
      const partials = [
        { mult: 1.000, amp: 1.00, decay: 0.85 },
        { mult: 2.002, amp: 0.68, decay: 1.10 },
        { mult: 3.006, amp: 0.52, decay: 1.35 },
        { mult: 4.011, amp: 0.44, decay: 1.60 },
        { mult: 5.018, amp: 0.36, decay: 1.85 },
        { mult: 6.026, amp: 0.28, decay: 2.15 },
        { mult: 7.037, amp: 0.22, decay: 2.45 },
        { mult: 8.049, amp: 0.16, decay: 2.80 },
        { mult: 9.064, amp: 0.11, decay: 3.10 },
        { mult: 10.08, amp: 0.08, decay: 3.50 }
      ];

      for (let i = 0; i < frameCount; i++) {
        const t = i / sampleRate;
        let envelope = (t < 0.03) ? (t / 0.03) : Math.exp(-(t - 0.03) * 0.95);
        const jawariShimmer = 1.0 + 0.22 * Math.sin(2 * Math.PI * 3.8 * t);

        let sample = 0;
        for (let p = 0; p < partials.length; p++) {
          const pt = partials[p];
          const freq = f0 * pt.mult;
          const pDecay = Math.exp(-t * pt.decay);
          const pShimmer = (p >= 3) ? jawariShimmer : 1.0;
          sample += Math.sin(2 * Math.PI * freq * t) * (pt.amp * pDecay * pShimmer);
        }

        const woodBody = 1.0 + 0.15 * Math.sin(2 * Math.PI * 220 * t) * Math.exp(-t * 2.0);
        data[i] = sample * envelope * woodBody * 0.22;
      }
    }

    function playSampledTanpura(targetFreq, startTime, duration, isLoop = false) {
      const ctx = getAudioContext();
      prepareAcousticSample();

      const source = ctx.createBufferSource();
      source.buffer = sampleBuffer;

      const playbackRate = targetFreq / SAMPLE_BASE_FREQ;
      source.playbackRate.setValueAtTime(playbackRate, startTime);

      const gainNode = ctx.createGain();
      if (isLoop) {
        gainNode.connect(loopBus);
      } else {
        gainNode.connect(ctx.destination);
      }

      gainNode.gain.setValueAtTime(0.0001, startTime);
      gainNode.gain.linearRampToValueAtTime(0.85, startTime + 0.02);
      gainNode.gain.setValueAtTime(0.85, startTime + Math.max(duration - 0.2, 0.1));
      if (gainNode.gain.exponentialRampToValueAtTime) {
        gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      }

      source.connect(gainNode);
      source.start(startTime);
      source.stop(startTime + duration + 0.05);
    }

    /* --------------------------------------------------------------------------
       ENGINE 2: DUAL-CHAMBER GOURD FORMANTS & LFO (VERSION 2)
       Tumba Gourd (220 Hz) + Tabli Neck (780 Hz) + 3.5 Hz LFO Shimmer
       -------------------------------------------------------------------------- */
    function playFormantTanpura(freq, startTime, duration, isLoop = false) {
      const ctx = getAudioContext();
      const masterGain = ctx.createGain();

      if (isLoop) {
        masterGain.connect(loopBus);
      } else {
        masterGain.connect(ctx.destination);
      }

      masterGain.gain.setValueAtTime(0.0001, startTime);
      masterGain.gain.linearRampToValueAtTime(0.35, startTime + 0.04);
      masterGain.gain.exponentialRampToValueAtTime(0.18, startTime + 0.40);
      masterGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      const tumbaFormant = ctx.createBiquadFilter();
      tumbaFormant.type = 'peaking';
      tumbaFormant.frequency.setValueAtTime(220, startTime);
      tumbaFormant.Q.setValueAtTime(2.2, startTime);
      tumbaFormant.gain.setValueAtTime(7.0, startTime);
      tumbaFormant.connect(masterGain);

      const tabliFormant = ctx.createBiquadFilter();
      tabliFormant.type = 'peaking';
      tabliFormant.frequency.setValueAtTime(780, startTime);
      tabliFormant.Q.setValueAtTime(3.0, startTime);
      tabliFormant.gain.setValueAtTime(4.5, startTime);
      tabliFormant.connect(tumbaFormant);

      const javariFilter = ctx.createBiquadFilter();
      javariFilter.type = 'lowpass';
      javariFilter.Q.setValueAtTime(4.0, startTime);
      javariFilter.frequency.setValueAtTime(Math.min(freq * 2.0, 400), startTime);
      javariFilter.frequency.exponentialRampToValueAtTime(Math.min(freq * 9.5, 9200), startTime + 0.15);
      javariFilter.frequency.exponentialRampToValueAtTime(Math.min(freq * 2.5, 2600), startTime + duration);
      javariFilter.connect(tabliFormant);

      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.type = 'sine';
      lfo.frequency.setValueAtTime(3.5, startTime);
      lfoGain.gain.setValueAtTime(Math.min(freq * 1.5, 250), startTime);
      lfo.connect(lfoGain);
      lfoGain.connect(javariFilter.frequency);
      lfo.start(startTime);
      lfo.stop(startTime + duration);

      const harmonics = [
        { mult: 1.0,  detune: 0.0,  gain: 0.40, type: 'sawtooth' },
        { mult: 2.0,  detune: 1.8,  gain: 0.28, type: 'sine' },
        { mult: 3.0,  detune: -2.5, gain: 0.22, type: 'triangle' },
        { mult: 4.0,  detune: 3.2,  gain: 0.17, type: 'sine' },
        { mult: 5.0,  detune: -1.9, gain: 0.13, type: 'sine' },
        { mult: 6.0,  detune: 4.1,  gain: 0.09, type: 'triangle' },
        { mult: 7.0,  detune: -3.4, gain: 0.07, type: 'sine' },
        { mult: 8.0,  detune: 2.6,  gain: 0.05, type: 'sine' },
        { mult: 9.0,  detune: -4.8, gain: 0.03, type: 'sine' },
        { mult: 10.0, detune: 5.2,  gain: 0.02, type: 'sine' }
      ];

      harmonics.forEach(h => {
        const osc = ctx.createOscillator();
        const hGain = ctx.createGain();
        osc.type = h.type;
        osc.frequency.setValueAtTime(freq * h.mult, startTime);
        osc.detune.setValueAtTime(h.detune, startTime);
        hGain.gain.setValueAtTime(h.gain, startTime);
        osc.connect(hGain);
        hGain.connect(javariFilter);
        osc.start(startTime);
        osc.stop(startTime + duration);
      });
    }

    /* --------------------------------------------------------------------------
       ENGINE 3: ACOUSTIC LADDER SYNTHESIZER (VERSION 1)  —  DISABLED in v2.0
       8-Harmonic ladder with micro-detuning & body peaking filter.
       Superseded by the Dual-Chamber Resonator (a richer version of the same
       idea) and the Harmonium Reed engine (a genuinely different timbre).
       Not called anywhere in the app — retained here purely for reference,
       as a record of an earlier design that was deliberately set aside.
       -------------------------------------------------------------------------- */
    /*

    /* --------------------------------------------------------------------------
       ENGINE 4: HARMONIUM REED  —  DEFAULT ENGINE in v2.0
       Free-reed model: twin detuned sawtooth reeds (beating pair), a single
       reed-chamber lowpass for warmth, a slow bellows-pulse LFO on gain, and a
       brief filtered noise "chiff" at onset. The envelope is attack-HOLD-release
       (a reed sustains under bellows pressure) rather than attack-decay (a
       plucked string dies away), with the hold capped to a short, fixed span
       so it never bleeds into the next note in the wide-spaced drone loop.
       Every node this engine creates is explicitly disconnected the moment
       it finishes (see the onended handlers below) — on some mobile browsers,
       finished-but-still-connected nodes can accumulate over a long loop
       session and cause exactly this kind of gradual audio degradation.
       -------------------------------------------------------------------------- */
    let reedChiffBuffer = null;

    function prepareReedChiff() {
      if (reedChiffBuffer) return;
      const ctx = getAudioContext();
      const sampleRate = ctx.sampleRate;
      const dur = 0.05;
      const frameCount = Math.floor(sampleRate * dur);
      reedChiffBuffer = ctx.createBuffer(1, frameCount, sampleRate);
      const data = reedChiffBuffer.getChannelData(0);
      for (let i = 0; i < frameCount; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 60);
        data[i] = (Math.random() * 2 - 1) * env;
      }
    }

    function playHarmoniumReed(freq, startTime, duration, isLoop = false) {
      const ctx = getAudioContext();
      prepareReedChiff();

      const masterGain = ctx.createGain();
      if (isLoop) {
        masterGain.connect(loopBus);
      } else {
        masterGain.connect(ctx.destination);
      }

      const attackTime = 0.04;
      const sustainLevel = 0.30;
      const holdTime = Math.min(0.55, Math.max(0, duration - attackTime - 0.1));
      const releaseStart = attackTime + holdTime;
      const releaseEnd = Math.min(duration, releaseStart + 0.35);

      masterGain.gain.setValueAtTime(0.0001, startTime);
      masterGain.gain.linearRampToValueAtTime(sustainLevel, startTime + attackTime);
      masterGain.gain.setValueAtTime(sustainLevel, startTime + releaseStart);
      masterGain.gain.linearRampToValueAtTime(0.0001, startTime + releaseEnd);

      const reedFilter = ctx.createBiquadFilter();
      reedFilter.type = 'lowpass';
      reedFilter.frequency.setValueAtTime(Math.min(freq * 6.0, 3200), startTime);
      reedFilter.Q.setValueAtTime(1.4, startTime);
      reedFilter.connect(masterGain);

      const bellowsLFO = ctx.createOscillator();
      const bellowsGain = ctx.createGain();
      bellowsLFO.type = 'sine';
      bellowsLFO.frequency.setValueAtTime(5.5, startTime);
      bellowsGain.gain.setValueAtTime(sustainLevel * 0.05, startTime);
      bellowsLFO.connect(bellowsGain);
      bellowsGain.connect(masterGain.gain);
      bellowsLFO.start(startTime);
      bellowsLFO.stop(startTime + releaseEnd);
      bellowsLFO.onended = () => {
        bellowsLFO.disconnect();
        bellowsGain.disconnect();
        reedFilter.disconnect();
        masterGain.disconnect();
      };

      const reedPair = [
        { detune: -4.5, gain: 0.55 },
        { detune:  4.5, gain: 0.55 }
      ];
      reedPair.forEach(r => {
        const osc = ctx.createOscillator();
        const oGain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, startTime);
        osc.detune.setValueAtTime(r.detune, startTime);
        oGain.gain.setValueAtTime(r.gain, startTime);
        osc.connect(oGain);
        oGain.connect(reedFilter);
        osc.start(startTime);
        osc.stop(startTime + releaseEnd);
        osc.onended = () => {
          osc.disconnect();
          oGain.disconnect();
        };
      });

      const chiffSource = ctx.createBufferSource();
      chiffSource.buffer = reedChiffBuffer;
      const chiffFilter = ctx.createBiquadFilter();
      chiffFilter.type = 'bandpass';
      chiffFilter.frequency.setValueAtTime(Math.min(freq * 3.0, 1800), startTime);
      chiffFilter.Q.setValueAtTime(1.0, startTime);
      const chiffGain = ctx.createGain();
      chiffGain.gain.setValueAtTime(0.18, startTime);
      chiffSource.connect(chiffFilter);
      chiffFilter.connect(chiffGain);
      chiffGain.connect(masterGain);
      chiffSource.start(startTime);
      chiffSource.onended = () => {
        chiffSource.disconnect();
        chiffFilter.disconnect();
        chiffGain.disconnect();
      };
    }

    /* --------------------------------------------------------------------------
       CENTRAL AUDIO ROUTER
       v2.0: three engines only (Harmonium Reed / Studio Sampled / Dual-Chamber
       Resonator). Harmonium Reed is both the default and the catch-all, since
       the dropdown never sends anything but these three values.
       -------------------------------------------------------------------------- */
    function playMasterStroke(freq, startTime, duration, isLoop = false) {
      const timbre = document.getElementById('timbreSelect').value;
      if (timbre === 'sampled') {
        playSampledTanpura(freq, startTime, duration, isLoop);
      } else if (timbre === 'formant') {
        playFormantTanpura(freq, startTime, duration, isLoop);
      } else {
        playHarmoniumReed(freq, startTime, duration, isLoop);
      }
    }

    function onTimbreChange() {
      updateTimbreAdvisor();
      if (isLooping) startTanpuraLoop();
    }

    function updateTimbreAdvisor() {
      const isMobile = window.innerWidth <= 600;
      const timbre = document.getElementById('timbreSelect').value;
      const advisor = document.getElementById('timbreAdvisor');

      if (timbre === 'formant' && isMobile) {
        advisor.textContent = "💡 Note: 'Dual Resonator' is real-time synthesis and may glitch on some phones — 'Harmonium' or 'Studio' are safer on mobile.";
      } else if (timbre === 'sampled' && !isMobile) {
        advisor.textContent = "💡 Tip: On laptop or headphones, 'Harmonium' or 'Dual Resonator' offer a richer tone than 'Studio'.";
      } else {
        advisor.textContent = "";
      }
    }

    const THAATS = {
      Bilawal: [
        { label: 'S', semitones: 0 }, { label: 'R', semitones: 2 }, { label: 'G', semitones: 4 },
        { label: 'M', semitones: 5 }, { label: 'P', semitones: 7 }, { label: 'D', semitones: 9 },
        { label: 'N', semitones: 11 }, { label: 'Sḁ', semitones: 12 }
      ],
      Kalyan: [
        { label: 'S', semitones: 0 }, { label: 'R', semitones: 2 }, { label: 'G', semitones: 4 },
        { label: "M'", semitones: 6 }, { label: 'P', semitones: 7 }, { label: 'D', semitones: 9 },
        { label: 'N', semitones: 11 }, { label: 'Sḁ', semitones: 12 }
      ],
      Khamaj: [
        { label: 'S', semitones: 0 }, { label: 'R', semitones: 2 }, { label: 'G', semitones: 4 },
        { label: 'M', semitones: 5 }, { label: 'P', semitones: 7 }, { label: 'D', semitones: 9 },
        { label: 'n', semitones: 10 }, { label: 'Sḁ', semitones: 12 }
      ],
      Kafi: [
        { label: 'S', semitones: 0 }, { label: 'R', semitones: 2 }, { label: 'g', semitones: 3 },
        { label: 'M', semitones: 5 }, { label: 'P', semitones: 7 }, { label: 'D', semitones: 9 },
        { label: 'n', semitones: 10 }, { label: 'Sḁ', semitones: 12 }
      ],
      Asavari: [
        { label: 'S', semitones: 0 }, { label: 'R', semitones: 2 }, { label: 'g', semitones: 3 },
        { label: 'M', semitones: 5 }, { label: 'P', semitones: 7 }, { label: 'd', semitones: 8 },
        { label: 'n', semitones: 10 }, { label: 'Sḁ', semitones: 12 }
      ],
      Bhairav: [
        { label: 'S', semitones: 0 }, { label: 'r', semitones: 1 }, { label: 'G', semitones: 4 },
        { label: 'M', semitones: 5 }, { label: 'P', semitones: 7 }, { label: 'd', semitones: 8 },
        { label: 'N', semitones: 11 }, { label: 'Sḁ', semitones: 12 }
      ],
      Bhairavi: [
        { label: 'S', semitones: 0 }, { label: 'r', semitones: 1 }, { label: 'g', semitones: 3 },
        { label: 'M', semitones: 5 }, { label: 'P', semitones: 7 }, { label: 'd', semitones: 8 },
        { label: 'n', semitones: 10 }, { label: 'Sḁ', semitones: 12 }
      ],
      Todi: [
        { label: 'S', semitones: 0 }, { label: 'r', semitones: 1 }, { label: 'g', semitones: 3 },
        { label: "M'", semitones: 6 }, { label: 'P', semitones: 7 }, { label: 'd', semitones: 8 },
        { label: 'N', semitones: 11 }, { label: 'Sḁ', semitones: 12 }
      ],
      Purvi: [
        { label: 'S', semitones: 0 }, { label: 'r', semitones: 1 }, { label: 'G', semitones: 4 },
        { label: "M'", semitones: 6 }, { label: 'P', semitones: 7 }, { label: 'd', semitones: 8 },
        { label: 'N', semitones: 11 }, { label: 'Sḁ', semitones: 12 }
      ],
      Marwa: [
        { label: 'S', semitones: 0 }, { label: 'r', semitones: 1 }, { label: 'G', semitones: 4 },
        { label: "M'", semitones: 6 }, { label: 'P', semitones: 7 }, { label: 'D', semitones: 9 },
        { label: 'N', semitones: 11 }, { label: 'Sḁ', semitones: 12 }
      ]
    };

    function getBaseFrequency() {
      return parseFloat(document.getElementById('scaleSelect').value);
    }

    function getFrequency(semitones) {
      return getBaseFrequency() * Math.pow(2, semitones / 12);
    }

    let isLooping = false;
    let loopTimeoutId = null;
    let isScalePlaying = false;
    let scaleTimeoutId = null;

    function toggleTanpuraLoop() {
      if (isLooping) {
        stopTanpuraLoop();
      } else {
        startTanpuraLoop();
      }
    }

    function startTanpuraLoop() {
      stopTanpuraLoop();
      const ctx = getAudioContext();

      loopBus.gain.cancelScheduledValues(ctx.currentTime);
      loopBus.gain.setValueAtTime(1.0, ctx.currentTime);

      isLooping = true;
      const btn = document.getElementById('toggleLoopBtn');
      btn.textContent = '⏹ Stop Tanpura Loop';
      btn.className = 'btn-loop-stop';

      document.getElementById('btnPlayAroh').disabled = true;
      document.getElementById('btnPlayAvroh').disabled = true;

      scheduleNextCycle();
    }

    function stopTanpuraLoop() {
      isLooping = false;
      if (loopTimeoutId) {
        clearTimeout(loopTimeoutId);
        loopTimeoutId = null;
      }
      if (audioCtx && loopBus) {
        loopBus.gain.cancelScheduledValues(audioCtx.currentTime);
        loopBus.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      }
      const btn = document.getElementById('toggleLoopBtn');
      if (btn) {
        btn.textContent = '▶ Start Tanpura Loop';
        btn.className = 'btn-loop-start';
      }

      if (!isScalePlaying) {
        document.getElementById('btnPlayAroh').disabled = false;
        document.getElementById('btnPlayAvroh').disabled = false;
      }
    }

    function onLoopPatternChange() {
      if (isLooping) startTanpuraLoop();
    }

    function scheduleNextCycle() {
      if (!isLooping) return;

      const pattern = document.getElementById('loopPatternSelect').value;
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const step = 1.25;
      const sustain = 2.4;

      let totalCycleSeconds = 0;

      if (pattern === 'pattern3') {
        playMasterStroke(getFrequency(0),  now, sustain, true);
        playMasterStroke(getFrequency(7),  now + step, sustain, true);
        playMasterStroke(getFrequency(12), now + (step * 2), sustain, true);
        totalCycleSeconds = (3 * step) + 0.35;
      } else {
        playMasterStroke(getFrequency(7),  now, sustain, true);
        playMasterStroke(getFrequency(12), now + step, sustain, true);
        playMasterStroke(getFrequency(12), now + (step * 2), sustain, true);
        playMasterStroke(getFrequency(0),  now + (step * 3), sustain, true);
        totalCycleSeconds = (4 * step) + 0.40;
      }

      loopTimeoutId = setTimeout(scheduleNextCycle, totalCycleSeconds * 1000);
    }

    function playAroh() {
      if (isLooping || isScalePlaying) return;
      playScaleSequence(currentSwaras.slice(), 'aroh');
    }

    function playAvroh() {
      if (isLooping || isScalePlaying) return;
      playScaleSequence(currentSwaras.slice().reverse(), 'avroh');
    }

    function playScaleSequence(notes, mode) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const step = 0.85;
      const noteDuration = 0.95;

      isScalePlaying = true;
      const btnAroh = document.getElementById('btnPlayAroh');
      const btnAvroh = document.getElementById('btnPlayAvroh');
      const btnLoop = document.getElementById('toggleLoopBtn');
      const btnGen = document.getElementById('btnGenChallenge');
      const btnReplay = document.getElementById('btnReplay');

      btnLoop.disabled = true;
      btnGen.disabled = true;
      btnReplay.disabled = true;

      if (mode === 'aroh') {
        btnAroh.textContent = '▲ Playing Aroh...';
        btnAvroh.disabled = true;
      } else {
        btnAvroh.textContent = '▼ Playing Avroh...';
        btnAroh.disabled = true;
      }

      notes.forEach((item, index) => {
        playMasterStroke(getFrequency(item.semitones), now + (index * step), noteDuration, false);
      });

      const totalDurationMs = (notes.length * step) * 1000;
      scaleTimeoutId = setTimeout(() => {
        isScalePlaying = false;
        btnAroh.textContent = '▲ Play Aroh';
        btnAvroh.textContent = '▼ Play Avroh';
        btnAroh.disabled = false;
        btnAvroh.disabled = false;
        btnLoop.disabled = false;
        btnGen.disabled = false;
        btnReplay.disabled = false;
      }, totalDurationMs);
    }

    let currentSwaras = [];

    function renderKeyboard() {
      const thaatName = document.getElementById('thaatSelect').value;
      currentSwaras = THAATS[thaatName];
      const keyboard = document.getElementById('keyboard');
      keyboard.innerHTML = '';

      currentSwaras.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'swar-btn';
        btn.innerHTML = `${item.label} <span class="key-hint">[${index + 1}]</span>`;
        btn.onclick = () => onSwarClick(item);
        keyboard.appendChild(btn);
      });
    }

    function onConfigChange() {
      renderKeyboard();
      currentSequence = [];
      userGuesses = [];
      failedAttempts = 0;
      updateDisplay();
      renderStatusLine();
      if (isLooping) startTanpuraLoop();
    }

    function onNoteCountChange() {
      currentSequence = [];
      userGuesses = [];
      failedAttempts = 0;
      updateDisplay();
      renderStatusLine();
    }

    function flashLoopBanner() {
      const banner = document.getElementById('loopRuleBanner');
      banner.classList.add('loop-rule-alert');
      setTimeout(() => {
        banner.classList.remove('loop-rule-alert');
      }, 1400);
    }

    let currentSequence = [];
    let userGuesses = [];
    let failedAttempts = 0;
    const MAX_ATTEMPTS = 3;

    function renderStatusLine(feedbackText = '', feedbackClass = '') {
      const line = document.getElementById('statusLine');
      if (currentSequence.length === 0 && !feedbackText) {
        line.innerHTML = '';
        return;
      }

      let attemptText = `Attempts: ${failedAttempts} / ${MAX_ATTEMPTS}`;
      if (!feedbackText) {
        line.innerHTML = `<span>${attemptText}</span>`;
      } else {
        line.innerHTML = `<span>${attemptText}</span> &bull; <span class="status-msg ${feedbackClass}">${feedbackText}</span>`;
      }
    }

    function generateAndPlayChallenge() {
      if (isLooping) {
        flashLoopBanner();
        return;
      }

      const count = parseInt(document.getElementById('noteCount').value, 10);
      currentSequence = [];
      userGuesses = [];
      failedAttempts = 0;

      for (let i = 0; i < count; i++) {
        const randomIndex = Math.floor(Math.random() * currentSwaras.length);
        currentSequence.push(currentSwaras[randomIndex]);
      }

      updateDisplay();
      renderStatusLine();
      replaySequence();
    }

    function replaySequence() {
      if (currentSequence.length === 0) return;

      if (isLooping) {
        flashLoopBanner();
        return;
      }

      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const step = 2.0;
      const noteDuration = 1.0;

      currentSequence.forEach((item, index) => {
        playMasterStroke(getFrequency(item.semitones), now + (index * step), noteDuration, false);
      });
    }

    function onSwarClick(item) {
      const ctx = getAudioContext();
      playMasterStroke(getFrequency(item.semitones), ctx.currentTime, 1.2, false);

      if (currentSequence.length > 0 && userGuesses.length < currentSequence.length) {
        userGuesses.push(item);
        updateDisplay();
        if (userGuesses.length === currentSequence.length) checkAnswer();
      }
    }

    function updateDisplay() {
      const targetElem = document.getElementById('targetDisplay');
      if (currentSequence.length === 0) {
        targetElem.textContent = '';
        return;
      }
      const remaining = currentSequence.length - userGuesses.length;
      let display = userGuesses.map(g => g.label).join('  ');
      for (let i = 0; i < remaining; i++) {
        display += (display.length > 0 ? '  ' : '') + '_';
      }
      targetElem.textContent = display;
    }

    function checkAnswer() {
      const isCorrect = currentSequence.every((val, idx) => val.label === userGuesses[idx].label);

      if (isCorrect) {
        renderStatusLine('Correct! Well done.', 'msg-correct');
        currentSequence = [];
      } else {
        failedAttempts++;
        if (failedAttempts >= MAX_ATTEMPTS) {
          const answerStr = currentSequence.map(n => n.label).join(' - ');
          renderStatusLine(`Out of attempts! Notes: ${answerStr}`, 'msg-failed');
          document.getElementById('targetDisplay').textContent = currentSequence.map(n => n.label).join('  ');
          currentSequence = [];
        } else {
          const remaining = MAX_ATTEMPTS - failedAttempts;
          renderStatusLine(`Incorrect! ${remaining} attempt${remaining > 1 ? 's' : ''} left.`, 'msg-incorrect');
          userGuesses = [];
          setTimeout(updateDisplay, 600);
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      const keyNum = parseInt(e.key, 10);
      if (keyNum >= 1 && keyNum <= currentSwaras.length) {
        onSwarClick(currentSwaras[keyNum - 1]);
      }
    });

window.addEventListener('DOMContentLoaded', () => {
  // Always default to Studio Sampled on all devices
  document.getElementById('timbreSelect').value = 'reed';
  updateTimbreAdvisor();
  renderKeyboard();
});
  </script>
